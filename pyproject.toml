[project]
name = "podsearch"
version = "0.1.0"
description = "Semantic search over podcast episodes - profiling demo"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "model2vec>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "feedparser>=6.0",
    "pyarrow>=18.0",
    "polars>=2.0.0",
    "feedparser-rs>=0.7.1",
    "lancedb>=0.40,<1",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=4.0",
    "torch>=2.4; sys_platform == 'linux'",
]

[project.scripts]
podsearch-catalog = "podsearch.cli.catalog:main"
podsearch-fetch-rss = "podsearch.cli.fetch_rss:main"
podsearch-ingest = "podsearch.cli.ingest:main"
podsearch-index = "podsearch.cli.indexing:main"
podsearch-serve = "podsearch.cli.serve:main"
podsearch-load = "podsearch.cli.load:main"
podsearch-query = "podsearch.cli.query:main"
podsearch-bench = "podsearch.cli.bench:main"

[dependency-groups]
dev = [
    { include-group = "test" },
    "marimo>=0.25.2",
    "ruff",
    "ty",
]
test = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "2 days"   # dependency cooldown; resolved to a timestamp in uv.lock
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[tool.hatch.build.targets.wheel]
packages = ["podsearch"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# marimo cells end with a bare expression: it is the cell's rendered output
"notebooks/*.py" = ["B018"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["ignore:Payload indexes have no effect:UserWarning"]

[tool.coverage.run]
branch = true
source = ["podsearch"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
