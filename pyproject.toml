[project]
name = "pepsearch"
version = "0.1.0"
description = "Semantic search over the PEPs - profiling demo"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "model2vec>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
]

[project.scripts]
pepsearch = "pepsearch.cli:main"
pepsearch-index = "pepsearch.indexing:main"
pepsearch-serve = "pepsearch.api:main"
pepsearch-load = "pepsearch.load:main"

[dependency-groups]
dev = [
    { include-group = "test" },
    "ruff",
    "ty",
]
test = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"   # dependency cooldown; resolved to a timestamp in uv.lock

[tool.hatch.build.targets.wheel]
packages = ["pepsearch"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["pepsearch"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
