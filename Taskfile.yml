version: "3"

tasks:
  test:
    desc: Run tests with coverage
    cmds:
      - uv run pytest --cov --cov-report=term-missing

  lint:
    desc: Lint and format
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  typecheck:
    desc: Type-check the project
    cmds:
      - uv run ty check

  check:
    desc: Lint + typecheck + test
    cmds:
      - task: lint
      - task: typecheck
      - task: test

  catalog:
    desc: Download the Podcast Index feed catalog (idempotent)
    cmds:
      - uv run podsearch-catalog {{.CLI_ARGS}}

  fetch:
    desc: Fetch RSS feeds into data/rss/*.parquet (idempotent)
    cmds:
      - uv run podsearch-fetch-rss {{.CLI_ARGS}}

  ingest:
    desc: Parse stored RSS into the episodes corpus (incremental)
    cmds:
      - uv run podsearch-ingest {{.CLI_ARGS}}

  index:
    desc: Build the embedding index from the episodes corpus
    cmds:
      - uv run podsearch-index {{.CLI_ARGS}}

  pipeline:
    desc: Run the data pipeline once via Dagu
    env:
      PODSEARCH_DIR: "{{.ROOT_DIR}}"
    cmds:
      - mise exec -- dagu start orchestration/podsearch.yaml {{.CLI_ARGS}}

  pipeline-lancedb:
    desc: Run the lancedb pipeline once via Dagu (fused ingest+index)
    env:
      PODSEARCH_DIR: "{{.ROOT_DIR}}"
    cmds:
      - mise exec -- dagu start orchestration/podsearch-lancedb.yaml {{.CLI_ARGS}}

  dagu:
    desc: Dagu web UI + scheduler on :8081 (loads orchestration/)
    env:
      PODSEARCH_DIR: "{{.ROOT_DIR}}"
      DAGU_AUTH_MODE: "none"
    cmds:
      - mise exec -- dagu start-all --dags orchestration --port 8081 {{.CLI_ARGS}}

  notebook:
    desc: Open the data-sampler marimo notebook in the browser
    cmds:
      - uv run marimo edit notebooks/sample.py {{.CLI_ARGS}}

  bench:
    desc: Run the search benchmark (profiling target)
    cmds:
      - uv run podsearch-bench {{.CLI_ARGS}}

  serve:
    desc: Run the FastAPI service on :8000 (attach target)
    cmds:
      - uv run podsearch-serve

  load:
    desc: Generate load against the service
    cmds:
      - uv run podsearch-load {{.CLI_ARGS}}

  update-dependencies:
    desc: Upgrade locked dependencies and hook revisions (7-day cooldown)
    cmds:
      - uv lock --upgrade
      - uv sync
      - prek update
      - task: check
