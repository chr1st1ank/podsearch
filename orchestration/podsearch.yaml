name: podsearch
description: Podcast Index catalog -> RSS fetch -> corpus ingest -> embedding index
type: graph

# work in the repo root 
working_dir: ..

defaults:
  retry_policy:
    limit: 1
    interval_sec: 30

params:
  - name: FEEDS
    default: "100000"
    description: Number of feeds to fetch (podsearch-fetch-rss --feeds)
  - name: LANG
    default: "de"
    # default: "de,en"  # de + en (the CLI default)
    description: Comma-separated feed languages (podsearch-fetch-rss and podsearch-ingest --lang)

steps:
 # - id: catalog
 #   run: uv run podsearch-catalog

  - id: fetch_rss
    run: uv run podsearch-fetch-rss --feeds ${FEEDS} --lang=${LANG}
 #   depends: catalog

  - id: ingest
    run: uv run podsearch-ingest --lang=${LANG}
    depends: fetch_rss

  - id: index
    run: uv run podsearch-index
    depends: ingest
